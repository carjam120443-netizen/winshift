name: Build WinShift ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Build ISO
        run: sudo bash build/build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: winshift-iso
          path: '*.iso'

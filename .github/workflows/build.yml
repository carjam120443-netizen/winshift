name: Build WinShift ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio wget

      - name: Install modern live-build
        run: |
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y ./live-build_20250505+deb13u1_all.deb
          lb --version

      - name: Build ISO
        run: sudo bash build/build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: WinShift-0.1.0-amd64
          path: 'WinShift-0.1.0-amd64.iso'
          if-no-files-found: error
